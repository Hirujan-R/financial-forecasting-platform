stock_features_config:

  # Log return
  - function: create_log_return_lag_feature
    kwargs:
      lag: 1
  - function: create_log_return_lag_feature
    kwargs:
      lag: 2
  - function: create_log_return_lag_feature
    kwargs:
      lag: 3
  - function: create_log_return_lag_feature
    kwargs:
      lag: 5
  - function: create_log_return_lag_feature
    kwargs:
      lag: 10
  - function: create_log_return_lag_feature
    kwargs:
      lag: 20

  # Trend positioning
  - function: create_log_distance_from_sma_feature
    kwargs:
      window_size: 5
  - function: create_log_distance_from_sma_feature
    kwargs:
      window_size: 10
  - function: create_log_distance_from_sma_feature
    kwargs:
      window_size: 20
  - function: create_log_distance_from_sma_feature
    kwargs:
      window_size: 50

  # Crossover
  - function: create_ema_crossover_feature
    kwargs:
      short_span: 5
      long_span: 20
  - function: create_ema_crossover_feature
    kwargs:
      short_span: 12
      long_span: 26

  # Volatility
  - function: create_log_return_volatility_feature
    kwargs:
      window_size: 5
  - function: create_log_return_volatility_feature
    kwargs:
      window_size: 10
  - function: create_log_return_volatility_feature
    kwargs:
      window_size: 20

  # Volatility regime
  - function: create_bollinger_bands_features
    kwargs:
      window_size: 10
  - function: create_bollinger_bands_features
    kwargs:
      window_size: 20
  - function: create_rsi_feature
    kwargs:
      window_size: 7
  - function: create_rsi_feature
    kwargs:
      window_size: 14
  - function: create_rsi_feature
    kwargs:
      window_size: 21
    
  # Garman-Klass Volatility
  - function: create_garman_klass_variance_feature
    kwargs:
      lag: 1
  - function: create_garman_klass_variance_feature
    kwargs:
      lag: 5
  - function: create_gk_variance_rolling_mean_feature
    kwargs:
      window_size: 5
      lag: 1
  - function: create_gk_variance_rolling_mean_feature
    kwargs:
      window_size: 20
      lag: 1
  - function: create_gk_regime_feature
    kwargs:
      short_span: 5
      long_span: 20
  - function: create_gk_regime_feature
    kwargs:
      short_span: 10
      long_span: 60
  - function: create_gk_regime_feature
    kwargs:
      short_span: 20
      long_span: 60

  # Parkinson Volatility
  - function: create_parkinson_variance_feature
    kwargs:
      lag: 1
  - function: create_parkinson_variance_feature
    kwargs:
      lag: 5
  - function: create_parkinson_variance_rolling_mean_feature
    kwargs:
      window_size: 20
      lag: 1
  - function: create_parkinson_regime_feature
    kwargs:
      short_span: 5
      long_span: 20
  - function: create_parkinson_regime_feature
    kwargs:
      short_span: 10
      long_span: 60
  - function: create_parkinson_regime_feature
    kwargs:
      short_span: 20
      long_span: 60
  - function: create_parkinson_volatility_feature
    kwargs:
      window_size: 5
      lag: 1
  - function: create_parkinson_volatility_feature
    kwargs:
      window_size: 20
      lag: 1


  # Rogers-Satchell Volatility
  - function: create_rogers_satchell_variance_feature
    kwargs:
      lag: 1
  - function: create_rogers_satchell_variance_feature
    kwargs:
      lag: 5
  - function: create_rogers_satchell_variance_rolling_mean_feature
    kwargs:
      window_size: 20
      lag: 1
  - function: create_rogers_satchell_regime_feature
    kwargs:
      short_span: 5
      long_span: 20
  - function: create_rogers_satchell_regime_feature
    kwargs:
      short_span: 10
      long_span: 60
  - function: create_rogers_satchell_regime_feature
    kwargs:
      short_span: 20
      long_span: 60
  - function: create_rogers_satchell_volatility_feature
    kwargs:
      window_size: 5
      lag: 1
  - function: create_rogers_satchell_volatility_feature
    kwargs:
      window_size: 20
      lag: 1

  # Yang-Zhang Volatility
  - function: create_yang_zhang_variance_feature
    kwargs:
      lag: 1
  - function: create_yang_zhang_variance_rolling_mean_feature
    kwargs:
      lag: 1
      window_size: 5
  - function: create_yang_zhang_variance_rolling_mean_feature
    kwargs:
      lag: 1
      window_size: 20
  - function: create_yang_zhang_regime_feature
    kwargs:
      short_span: 5
      long_span: 20
  - function: create_yang_zhang_regime_feature
    kwargs:
      short_span: 10
      long_span: 60
  - function: create_yang_zhang_regime_feature
    kwargs:
      short_span: 20
      long_span: 60
  - function: create_yang_zhang_volatility_feature
    kwargs:
      lag: 1
      window_size: 5
  - function: create_yang_zhang_volatility_feature
    kwargs:
      lag: 1
      window_size: 20
  - function: create_yang_zhang_volatility_feature
    kwargs:
      lag: 1
      window_size: 60

  # Volatility Ratios
  - function: create_yang_zhang_volatility_ratio_feature
    kwargs:
      short_span: 5
      long_span: 20

  - function: create_yang_zhang_volatility_ratio_feature
    kwargs:
      short_span: 12
      long_span: 26
  - function: create_yang_zhang_volatility_ratio_feature
    kwargs:
      short_span: 20
      long_span: 60

  # Candle Structure
  - function: create_daily_range_feature
    kwargs: {}
  - function: create_range_percentage_feature
    kwargs: {}
  - function: create_candle_body_feature
    kwargs: {}
  - function: create_upper_shadow_feature
    kwargs: {}
  - function: create_lower_shadow_feature
    kwargs: {}
  - function: create_body_percentage_feature
    kwargs: {}
  - function: create_upper_shadow_percentage_feature
    kwargs: {}
  - function: create_lower_shadow_percentage_feature
    kwargs: {}

  # Volume
  - function: create_volume_pct_change_feature
    kwargs:
      lag: 1
  - function: create_relative_volume_feature
    kwargs:
      window_size: 5
  - function: create_relative_volume_feature
    kwargs:
      window_size: 20
  - function: create_volume_sma_feature
    kwargs:
      window_size: 20
  - function: create_return_x_volume_feature
    kwargs: {}
    
  # Risk
  - function: create_drawdown_feature
    kwargs:
      window_size: 10
  - function: create_drawdown_feature
    kwargs:
      window_size: 20
  - function: create_drawdown_feature
    kwargs:
      window_size: 50
  - function: create_rolling_window_mdd_feature
    kwargs:
      window_size: 10
  - function: create_rolling_window_mdd_feature
    kwargs:
      window_size: 20
  - function: create_rolling_window_mdd_feature
    kwargs:
      window_size: 50
  - function: create_rolling_sharpe_ratio_feature
    kwargs:
      window_size: 10
  - function: create_rolling_sharpe_ratio_feature
    kwargs:
      window_size: 20
  
  # Momentum
  - function: create_momentum_feature
    kwargs:
      lag: 1
  - function: create_momentum_feature
    kwargs:
      lag: 10

  # Date
  - function: create_date_features
    kwargs: {}

  # Target Variable
  - function: create_market_movement_target
    kwargs: {}

